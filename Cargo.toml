[package]
name = "rust_reel_forge"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
ab_glyph = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
regex = "1.10"
walkdir = "2.4"
rand = "0.8"
encoding_rs = "0.8"
eframe = { version = "0.26", features = ["wgpu", "glow"] }
egui = "0.26"
rfd = "0.14"

# Explicitly enable winapi features to solve Eframe build bugs on Windows
winapi = { version = "0.3", features = ["winuser", "windef"] }
